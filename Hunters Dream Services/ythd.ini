# Hunter's Dream Services for Yharnam Together - settings. One KEY=VALUE per line; a line starting with # is ignored.
# Read at every game start. The mod is switched on and off in the launcher's Mods page.

# The community server that answers the game's own services: messages, bloodstains, wandering ghosts,
# chalice search and sharing, standard chalice rituals. Only scheme://host is used (the ports are the game's).
community=https://thehuntersdream.com

# 1 = send the game's play logs to the community server's API, as the Windows port does (instead of FromSoftware's
# old storage buckets). 0 = leave them alone.
playlogs=1

# 1 = before each start, check that the community server answers (a few seconds at most). When it does not, that
# start keeps your host's own services, so co-op never waits for an outage. 0 = never check.
fallback=1

# Advanced: the port and time the fallback check uses.
# probe_port=20443
# probe_timeout_ms=3000
